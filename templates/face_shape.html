<html>

<head>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"
        integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
    <link rel="stylesheet" type="text/css" href="static\css\face_shape.css">
    <style>
        #camera-section {
            margin-top: 16px;
            text-align: center;
        }
        #video-stream {
            display: none;
            width: 480px;
            max-width: 100%;
            border-radius: 12px;
            border: 2px solid #5b9aa0;
            margin: 12px auto;
        }
        #canvas-snap { display: none; }
        #camera_button {
            margin-top: 10px;
        }
        #snap_button {
            display: none;
            margin-top: 10px;
        }
        #stop_button {
            display: none;
            margin-top: 10px;
        }
        #cam-hint {
            font-size: 0.9rem;
            color: #888;
            margin-top: 6px;
        }
    </style>
</head>

<body>
    <div class='header'>
        FACE SHAPE
    </div>
    <div class='content'>

        <div class='upload_part'>
            <!-- Upload file -->
            <button class='upload_button' id="upload_button">📁 Chọn file ảnh để nhận diện...</button>
            <div class='upload_hint' id='upload_hint'>
                Các định dạng được hỗ trợ: PNG, JPG và JPEG.
            </div>
            <form action="/face_shape" method="POST" enctype="multipart/form-data" id='form'>
                <input type="file" name="file" id="fileinput" style="display: none;" accept="image/*">
            </form>

            <!-- Camera -->
            <div id="camera-section">
                <button class='upload_button' id="camera_button">📷 Dùng camera để nhận diện...</button>
                <button class='upload_button' id="snap_button">📸 Chụp & Phân tích</button>
                <button class='upload_button' id="stop_button">❌ Tắt camera</button>
                <div id="cam-hint"></div>
                <video id="video-stream" autoplay playsinline></video>
                <canvas id="canvas-snap"></canvas>
                <!-- Hidden form to POST captured image -->
                <form action="/face_shape" method="POST" enctype="multipart/form-data" id="cam-form">
                    <input type="file" name="file" id="cam-fileinput" style="display:none;">
                </form>
            </div>
        </div>

        <div class='result_part'>
            {% if msg %}
            <div class='result_title'><b>Kết quả nhận diện</b></div>
            <div class='result_id'>{{ msg }}</div>
            {% if label %}
            <div class='result_id'>Nhận diện được: <span class='result_label'>{{ label }}</span></div>
            {% set face_shape = label.split(": ")[1].strip() | lower %}
            <form action="/face_shape/{{face_shape}}" method="GET">
                <button>Xem thêm về {{ label }}</button>
            </form>
            {% endif %}
            {% endif %}
        </div>
    </div>
    <div class='footer'>
        <a href="/" class="back_home_button">Back to Home</a>
    </div>

</body>
<script src="static\js\face_shape.js"></script>

</html>
